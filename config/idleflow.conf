# idleflow configuration. Sourced by the scripts; read by the command prompts.
# A project overrides values in its own .idleflow/idleflow.conf (see scripts/conf.sh for the
# keys it may set); /idleflow:customize writes that file.
# Every threshold the workflow uses lives here so the retro step can propose changes
# to a number instead of to a prompt.

# --- Diff gate ---------------------------------------------------------------
# Hand-written code lines (added + deleted) per task before the auditor is invoked.
DIFF_LIMIT=1500
# Tolerance band: within LIMIT + SLACK the auditor still runs, but "accept" is the
# default unless it finds a reason not to. Beyond LIMIT + SLACK, "split" is the default.
DIFF_SLACK=300
# Paths excluded from the line count. Git pathspec glob syntax, one per line.
# Every pattern is prefixed with '**/' so it matches at any depth: in git's glob
# magic a bare '*.md' matches only files at the repo root.
# Docs and text are not code; lockfiles, snapshots, minified bundles and generated
# dirs are not hand-written.
DIFF_EXCLUDE='
**/*.md
**/*.mdx
**/*.txt
**/*.rst
**/*.lock
**/package-lock.json
**/yarn.lock
**/pnpm-lock.yaml
**/poetry.lock
**/Pipfile.lock
**/Cargo.lock
**/go.sum
**/*.snap
**/*.min.js
**/*.min.css
**/*.map
**/*.svg
**/*.csv
**/*.json.gz
**/dist/**
**/build/**
**/node_modules/**
**/vendor/**
**/__pycache__/**
**/.pytest_cache/**
**/.mypy_cache/**
**/.ruff_cache/**
**/.cache/**
**/coverage/**
**/__generated__/**
**/generated/**
**/*.generated.*
**/*.pb.go
**/*_pb2.py
**/.idleflow/runs/**
'

# --- Fan-out -----------------------------------------------------------------
# Parallel implementers per group. SIZE_M_IMPLEMENTERS applies to size M runs; L uses the max.
MAX_IMPLEMENTERS=4
SIZE_M_IMPLEMENTERS=3

# --- Debate ------------------------------------------------------------------
DEBATE_ROUNDS=2

# --- Retry -------------------------------------------------------------------
# Retries per task (a review or audit rejection, a blocked or partial report)
# before the run stops and asks the human. Each task has its own count.
MAX_RETRIES=1

# --- Sizing budgets (classifier hints, in hand-written lines) ----------------
# S: one implementer, one reviewer (correctness only).
# M: up to SIZE_M_IMPLEMENTERS implementers, both reviewers.
# L: up to MAX_IMPLEMENTERS, both reviewers, the debate, tooling advice.
# The debate also runs at any size the classifier marks risk: high; stack and library
# research run on greenfield or when it reports new_dependency: true.
SIZE_S_MAX=150
SIZE_M_MAX=800
# If an S task's diff exceeds this, the run is bumped to M and the conformance
# reviewer runs as well.
SIZE_S_OVERRUN=250

# --- Large codebases ---------------------------------------------------------
# Hand-written code lines in the whole repo (docs, lockfiles and generated files
# excluded, same rules as DIFF_EXCLUDE) at or above which the stack advisor proposes
# a code map / index tool (Graphify, Serena, Sourcegraph, ctags) instead of grep.
LARGE_REPO_LOC=100000

# --- Steps -------------------------------------------------------------------
# auto: the step runs when commands/feature.md's condition holds (size, risk, greenfield,
# new dependency). on: it always runs. off: it never runs.
STEP_DEBATE=auto
STEP_STACK=auto
STEP_LIBRARIES=auto
STEP_TOOLING=auto
STEP_DOC_KEEPER=auto
# Mutation sweep: implementers break their own change on purpose to prove the tests catch it.
# auto: tasks the plan marks `mutation: true`; on: every task; off: none.
STEP_MUTATION=auto

# --- Worktrees ---------------------------------------------------------------
# Worktrees are created as siblings of the repo: <repo>__wt/<task-id>
WORKTREE_SUFFIX="__wt"
